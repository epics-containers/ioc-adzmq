# yaml-language-server: $schema=/epics/ibek-defs/ioc.schema.json
# Copied from https://gitlab.diamond.ac.uk/controls/containers/beamline/b22-services
# services/bl22b-di-zmq-01/config/ioc.yaml at commit d0dcb4438f9d1565434f4ae225fec683620f61c6
# Changed, so that nobody running this test reaches a real device:
# - 1 device address replaced with 127.0.0.1
# Changed to fit the current image (the source was written for 2025.7.1):
# - ADCore.NDPvaPlugin renamed ADCore.NDPvxsPlugin (ibek-support 654c18a)
# tests/run-tests.sh runs it with start.sh --test, which generates the
# runtime assets but does not launch the IOC.

ioc_name: "{{  _global.get_env('IOC_NAME') }}"

description: auto-generated by https://github.com/epics-containers/builder2ibek

entities:
  - type: epics.EpicsEnvSet
    name: EPICS_TS_MIN_WEST
    value: "0"

  - type: epics.EpicsEnvSet
    name: STREAM_PROTOCOL_PATH
    value: /epics/runtime/protocol/

  - type: devIocStats.iocAdminSoft
    IOC: "{{ ioc_name | upper }}"

  - type: epics.EpicsCaMaxArrayBytes
    max_bytes: 40000000

  # ADZMQ
  - type: ADZMQ.ZMQDriver
    P: BL22B-DI-CAM-10
    R: ":CAM:"
    PORT: BOX3.WINCAM.DRV
    SOURCE_ADDR: "tcp://127.0.0.1:1515 SUB CONNECT"
    # CTRL_MODE: 0

  # ADCore

  - type: ADCore.NDROI
    ADDR: 0
    NDARRAY_ADDR: 0
    NDARRAY_PORT: BOX3.WINCAM.DRV
    P: BL22B-DI-CAM-10
    PORT: BOX3.WINCAM.roi
    QUEUE: 16
    R: ":ROI:"
    TIMEOUT: 1
    ENABLED: 1

  - type: ADCore.NDProcess
    ADDR: 0
    NDARRAY_ADDR: 0
    NDARRAY_PORT: BOX3.WINCAM.roi
    P: BL22B-DI-CAM-10
    PORT: BOX3.WINCAM.proc
    QUEUE: 16
    R: ":PROC:"
    TIMEOUT: 1
    ENABLED: 1

  - type: ADCore.NDStats
    ADDR: 0
    HIST_SIZE: 256
    NCHANS: 20000
    NDARRAY_ADDR: 0
    NDARRAY_PORT: BOX3.WINCAM.proc
    P: BL22B-DI-CAM-10
    PORT: BOX3.WINCAM.stat
    QUEUE: 16
    R: ":STAT:"
    TIMEOUT: 1
    XSIZE: 1024
    YSIZE: 768
    ENABLED: 1

  - type: ADCore.NDOverlay
    ADDR: 0
    NDARRAY_ADDR: 0
    NDARRAY_PORT: BOX3.WINCAM.stat
    P: BL22B-DI-CAM-10
    PORT: BOX3.WINCAM.over
    QUEUE: 16
    R: ":OVER:"
    TIMEOUT: 1
    ENABLED: 1

  - type: ADCore.NDStdArrays
    ADDR: 0
    FTVL: LONG
    NDARRAY_ADDR: 0
    NDARRAY_PORT: BOX3.WINCAM.over
    NELEMENTS: 786432
    P: BL22B-DI-CAM-10
    PORT: BOX3.WINCAM.arr
    QUEUE: 2
    R: ":ARR:"
    TIMEOUT: 1
    TYPE: Int32
    ENABLED: 1

  - type: ADCore.NDFileTIFF
    ADDR: 0
    NDARRAY_ADDR: 0
    NDARRAY_PORT: BOX3.WINCAM.roi
    P: BL22B-DI-CAM-10
    PORT: BOX3.WINCAM.tiff
    QUEUE: 16
    R: ":TIFF:"
    TIMEOUT: 1

  - type: ADCore.NDFileHDF5
    ADDR: 0
    NDARRAY_ADDR: 0
    NDARRAY_PORT: BOX3.WINCAM.roi
    P: BL22B-DI-CAM-10
    PORT: BOX3.WINCAM.hdf
    QUEUE: 16
    R: ":HDF5:"
    TIMEOUT: 1

  - type: ADCore.NDPvxsPlugin
    P: BL22B-DI-CAM-10
    R: ":PVA:"
    PORT: BOX3.WINCAM.pva
    NDARRAY_PORT: BOX3.WINCAM.roi
    PVNAME: WINCAM

  # COMMANDS

  - type: epics.dbpf
    pv: BL22B-DI-CAM-10:CAM:MessageTimeout
    value: "10000"

  - type: epics.dbpf
    pv: BL22B-DI-CAM-10:CAM:CustomErrorMsg
    value: Windows SW unresponsive

  - type: epics.dbpf
    pv: BL22B-DI-CAM-10:CAM:Gain.DISA
    value: "1"

  - type: epics.dbpf
    pv: BL22B-DI-CAM-10:ROI:DataTypeOut
    value: UInt16

  - type: epics.dbpf
    pv: BL22B-DI-CAM-10:PROC:DataTypeOut
    value: UInt16
